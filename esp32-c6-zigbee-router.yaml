# ESPHome configuration for an ESP32-C6 Zigbee router
#
# Uses the native ESPHome `zigbee` component (ESPHome 2026.5 or newer).
# No secrets and no WiFi needed. See README.md for details.

substitutions:
  device_name: esp32-c6-zigbee-router
  friendly_name: ESP32-C6 Zigbee Router
  # Seeed XIAO ESP32C6 antenna selection:
  # ALWAYS_OFF = built-in ceramic antenna, ALWAYS_ON = external U.FL/SMA antenna
  antenna_mode: ALWAYS_OFF

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

zigbee:
  id: zb
  router: true
  # Routers are always on, so report mains power to the coordinator
  power_source: MAINS_SINGLE_PHASE
  on_join:
    then:
      - logger.log:
          format: "%s Zigbee network"
          args: ['x ? "Joined" : "Rejoined"']

logger:

# --- Seeed XIAO ESP32C6 specific (remove this block for other boards) ---
# GPIO3 LOW powers the RF switch, GPIO14 selects the antenna (LOW = built-in, HIGH = external).
switch:
  - platform: gpio
    id: rf_switch_power
    pin:
      number: GPIO3
      inverted: true
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: external_antenna
    pin: GPIO14
    restore_mode: ${antenna_mode}

# User LED (active low): blinks on warnings/errors, off when healthy
status_led:
  pin:
    number: GPIO15
    inverted: true
    ignore_strapping_warning: true

# BOOT button: hold for 5 seconds to leave the Zigbee network and pair again
binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO9
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
    on_click:
      min_length: 5s
      max_length: 30s
      then:
        - logger.log: "BOOT button held, Zigbee factory reset"
        - zigbee.factory_reset
# --- end of XIAO specific block ---

# ============================================
# Optional: chip temperature as a Zigbee sensor
# ============================================
# Shows up in Zigbee2MQTT/ZHA as an analog input (°C).
# Remove and re-add the router in your coordinator after enabling it.
# sensor:
#   - platform: internal_temperature
#     name: Chip Temperature
#     update_interval: 60s

# ============================================
# WiFi is OPTIONAL and NOT recommended for a Zigbee router!
# WiFi and Zigbee share the same radio. With WiFi active the router misses
# Zigbee packets and can destabilize your mesh. Only enable it for short
# periods, e.g. for OTA updates. A WiFi access point (ap:) is not supported.
# ============================================
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# ota:
#   - platform: esphome
