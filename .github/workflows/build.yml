name: Build

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"

      # ESPHome is pinned in requirements.txt; the cache saves downloading and
      # building the wheels and rolls over with a new pin
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Install ESPHome
        id: esphome
        run: |
          pip install -r requirements.txt
          echo "version=$(esphome version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Validate config
        run: esphome config esp32-c6-zigbee-router.yaml

      # ESP-IDF, toolchains and the IDF Python env are downloaded to
      # ~/.cache/esphome (no PlatformIO). That env links to the runner's
      # Python, so the key includes the Python and ESPHome version.
      - name: Cache ESPHome toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}

      # Build directory (incl. storage JSON, without which ESPHome cleans the
      # build): ninja then only recompiles what changed
      - name: Cache build directory
        uses: actions/cache@v6
        with:
          path: .esphome
          key: esphome-build-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}-${{ hashFiles('esp32-c6-zigbee-router.yaml') }}
          restore-keys: esphome-build-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}-

      - name: Compile firmware
        run: esphome compile esp32-c6-zigbee-router.yaml
