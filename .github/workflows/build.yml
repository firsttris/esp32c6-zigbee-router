name: Build

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    # Weekly, to notice when a new ESPHome release breaks the config
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate config
        run: esphome config esp32-c6-zigbee-router.yaml

      # ESP-IDF and toolchains are downloaded to ~/.cache/esphome
      - name: Cache ESPHome toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ runner.os }}-${{ hashFiles('esp32-c6-zigbee-router.yaml') }}
          restore-keys: esphome-${{ runner.os }}-

      - name: Compile firmware
        run: esphome compile esp32-c6-zigbee-router.yaml
